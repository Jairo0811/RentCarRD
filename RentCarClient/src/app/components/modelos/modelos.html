<div class="container mt-4">
  <h2>Gestión de Modelos</h2>
  <hr />

  <div class="card mb-4">
    <div
      class="card-header text-white"
      [ngClass]="modoEdicion ? 'bg-warning' : 'bg-primary'"
    >
      {{ modoEdicion ? 'Editar Modelo' : 'Nuevo Modelo' }}
    </div>

    <div class="card-body">
      <div class="row g-3">
        <div class="col-md-5">
          <label class="form-label">Descripción del Modelo</label>

          <input
            type="text"
            class="form-control"
            [(ngModel)]="modeloActual.descripcion"
            placeholder="Ej. Civic, Corolla..."
          />
        </div>

        <div class="col-md-5">
          <label class="form-label">Marca</label>

          <select
            class="form-select"
            [(ngModel)]="modeloActual.idMarca"
          >
            <option [ngValue]="0" disabled>
              Seleccione una marca...
            </option>

            <option
              *ngFor="let marca of listaMarcas"
              [ngValue]="marca.id"
            >
              {{ marca.descripcion }}
            </option>
          </select>
        </div>

        <div class="col-md-2 d-flex align-items-end gap-2">
          <button
            class="btn w-100"
            [ngClass]="modoEdicion ? 'btn-warning' : 'btn-success'"
            (click)="guardarModelo()"
          >
            {{ modoEdicion ? 'Actualizar' : 'Guardar' }}
          </button>
        </div>

        <div class="col-12 text-end" *ngIf="modoEdicion">
          <button
            class="btn btn-secondary"
            (click)="cancelarEdicion()"
          >
            Cancelar edición
          </button>
        </div>
      </div>
    </div>
  </div>

  <div class="table-responsive">
    <table class="table table-striped table-hover mt-3 align-middle">
      <thead class="table-dark">
        <tr>
          <th>ID</th>
          <th>Descripción</th>
          <th>Marca</th>
          <th>Estado</th>
          <th class="text-center">Acciones</th>
        </tr>
      </thead>

      <tbody>
        <tr *ngFor="let modelo of listaModelos">
          <td>{{ modelo.id }}</td>
          <td>{{ modelo.descripcion }}</td>
          <td>{{ obtenerNombreMarca(modelo.idMarca) }}</td>
          <td>
            <span
              class="badge"
              [ngClass]="modelo.estado ? 'bg-success' : 'bg-danger'"
            >
              {{ modelo.estado ? 'Activo' : 'Inactivo' }}
            </span>
          </td>
          <td class="text-center">
            <button
              class="btn btn-warning btn-sm me-2"
              (click)="editarModelo(modelo)"
            >
              ✏️ Editar
            </button>

            <button
              class="btn btn-danger btn-sm"
              (click)="eliminarModelo(modelo.id)"
            >
              🗑️ Eliminar
            </button>
          </td>
        </tr>

        <tr *ngIf="listaModelos.length === 0">
          <td colspan="5" class="text-center">
            No hay modelos registrados.
          </td>
        </tr>
      </tbody>
    </table>
  </div>
</div>
