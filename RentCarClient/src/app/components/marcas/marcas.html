<div class="container mt-4">
  <h2 class="fw-bold text-secondary mb-4">Gestión de Marcas</h2>

  <div class="card shadow-sm border-0 mb-4 bg-light">
    <div class="card-body p-4">
      <div class="row align-items-end g-3">
        <div class="col-md-6">
          <label class="form-label fw-bold">
            Descripción de la Marca
          </label>

          <input
            type="text"
            class="form-control"
            [(ngModel)]="nuevaMarca.descripcion"
            placeholder="Ej. Toyota"
          />
        </div>

        <div class="col-md-2">
          <button
            class="btn fw-bold w-100"
            [ngClass]="modoEdicion ? 'btn-warning' : 'btn-primary'"
            (click)="guardarMarca()"
          >
            {{ modoEdicion ? 'Actualizar' : 'Guardar' }}
          </button>
        </div>

        <div class="col-md-2" *ngIf="modoEdicion">
          <button
            class="btn btn-secondary fw-bold w-100"
            (click)="cancelarEdicion()"
          >
            Cancelar
          </button>
        </div>
      </div>
    </div>
  </div>

  <div class="card shadow-sm border-0">
    <div class="table-responsive">
      <table class="table table-hover mb-0 align-middle">
        <thead class="table-dark">
          <tr>
            <th>ID</th>
            <th>Descripción</th>
            <th>Estado</th>
            <th class="text-center">Acciones</th>
          </tr>
        </thead>

        <tbody>
          <tr *ngFor="let m of marcas">
            <td>{{ m.id }}</td>
            <td>{{ m.descripcion }}</td>
            <td>
              <span
                class="badge"
                [ngClass]="m.estado ? 'bg-success' : 'bg-danger'"
              >
                {{ m.estado ? 'Activo' : 'Inactivo' }}
              </span>
            </td>
            <td class="text-center">
              <button
                class="btn btn-warning btn-sm fw-bold"
                (click)="editarMarca(m)"
              >
                ✏️ Editar
              </button>
            </td>
          </tr>

          <tr *ngIf="marcas.length === 0">
            <td colspan="4" class="text-center py-4 text-muted">
              No hay marcas registradas.
            </td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>
</div>
