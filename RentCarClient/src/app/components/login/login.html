<div class="login-fondo min-vh-100 d-flex justify-content-center align-items-center bg-light px-3 py-4">
  <div class="card shadow-lg border-0 rounded-4 login-tarjeta w-100">
    <div class="card-body p-4 p-sm-5 text-center">
      <div class="mb-4">
        <img src="/images/logo.png" alt="RentCarRD" class="img-fluid mb-3 login-logo" />
        <h1 class="h5 fw-bold text-secondary mb-1">Iniciar sesión</h1>
        <p class="text-muted small mb-0">Ingresa tus credenciales para continuar</p>
      </div>

      @if (aviso && !error) {
        <div class="alert alert-info small text-start" role="status">{{ aviso }}</div>
      }

      <form (ngSubmit)="ingresar()" novalidate [attr.aria-busy]="procesandoLogin">
        <div class="mb-3 text-start">
          <label class="form-label fw-bold text-muted small" for="login-usuario">Usuario</label>
          <input
            type="text"
            id="login-usuario"
            name="usuario"
            [(ngModel)]="usuario"
            class="form-control form-control-lg bg-light border-0"
            placeholder="Ej: admin"
            autocomplete="username"
            autocapitalize="none"
            spellcheck="false"
            required
            [attr.aria-invalid]="error ? 'true' : null"
            aria-describedby="login-error"
          />
        </div>

        <div class="mb-4 text-start">
          <label class="form-label fw-bold text-muted small" for="login-password">Contraseña</label>
          <input
            type="password"
            id="login-password"
            name="password"
            [(ngModel)]="password"
            class="form-control form-control-lg bg-light border-0"
            placeholder="••••••••"
            autocomplete="current-password"
            required
            [attr.aria-invalid]="error ? 'true' : null"
            aria-describedby="login-error"
          />
        </div>

        <div id="login-error" aria-live="assertive">
          @if (error) {
            <div class="alert alert-danger small text-start py-2" role="alert">{{ error }}</div>
          }
        </div>

        <button type="submit" class="btn btn-primary btn-lg w-100 fw-bold shadow-sm rounded-pill" [disabled]="procesandoLogin">
          @if (procesandoLogin) {
            <span class="spinner-border spinner-border-sm me-2" aria-hidden="true"></span>Verificando…
          } @else {
            Iniciar Sesión
          }
        </button>
      </form>
    </div>
  </div>
</div>
