name: Refresh npm lockfile

on:
  push:
    branches:
      - chore/v1.2-portfolio-freeze

permissions:
  contents: write

jobs:
  refresh:
    if: ${{ !contains(github.event.head_commit.message, '[lock-refresh]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chore/v1.2-portfolio-freeze
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: RentCarClient/package-lock.json
      - name: Regenerate dependency tree
        working-directory: RentCarClient
        run: |
          npm install
          npm audit fix
          npm audit --audit-level=high
      - name: Commit refreshed lockfile
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add RentCarClient/package.json RentCarClient/package-lock.json
          if git diff --cached --quiet; then
            echo "No lockfile changes required."
            exit 0
          fi
          git commit -m "chore: refresh npm lockfile [lock-refresh]"
          git push origin HEAD:chore/v1.2-portfolio-freeze
