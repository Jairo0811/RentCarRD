name: Apply Juan P. Valdez lineage docs

on:
  push:
    branches:
      - 'docs/juan-p-valdez-lineage'
    paths:
      - '.github/workflows/juan-p-valdez-lineage.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: docs/juan-p-valdez-lineage
      - run: python .github/scripts/patch-juan-p-valdez-lineage.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          git commit -m "docs: document Juan P. Valdez academic lineage"
          git push origin HEAD:docs/juan-p-valdez-lineage
