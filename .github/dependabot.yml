version: 2
updates:
  - package-ecosystem: nuget
    directory: /RentCar.API/RentCar.API
    schedule:
      interval: weekly
    # Portfolio freeze: disable routine version updates; security updates remain available.
    open-pull-requests-limit: 0

  - package-ecosystem: npm
    directory: /RentCarClient
    schedule:
      interval: weekly
    # Portfolio freeze: disable routine version updates; security updates remain available.
    open-pull-requests-limit: 0

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    # Portfolio freeze: no routine action-version churn.
    open-pull-requests-limit: 0
